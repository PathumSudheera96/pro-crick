services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    command: pnpm dev

  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-procric}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-procric_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-procric}
    ports:
      - "5432:5432"
    volumes:
      - procric_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-procric} -d ${POSTGRES_DB:-procric}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  app_node_modules:
  procric_postgres_data:
